```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ趣味生成器</title>
    <!-- Tailwind CSS for modern mobile-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #6EE7B7 0%, #3B82F6 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md glass-card rounded-3xl shadow-2xl overflow-hidden p-6 text-gray-800">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">✨ QQ趣味生成器 ✨</h1>
            <p class="text-sm text-gray-500 mt-1">发到QQ群或好友聊天，点开就能玩！</p>
        </div>

        <!-- Mode Selector Tabs -->
        <div class="grid grid-cols-2 gap-2 bg-gray-200 p-1.5 rounded-2xl mb-6">
            <button onclick="switchTab('roast')" id="tab-roast" class="py-2.5 text-xs font-bold rounded-xl bg-white shadow-sm text-blue-600 transition">今日运势</button>
            <button onclick="switchTab('excuse')" id="tab-excuse" class="py-2.5 text-xs font-bold rounded-xl text-gray-600 transition">摸鱼借口</button>
            <button onclick="switchTab('couple')" id="tab-couple" class="py-2.5 text-xs font-bold rounded-xl text-gray-600 transition">情话生成</button>
            <button onclick="switchTab('food')" id="tab-food" class="py-2.5 text-xs font-bold rounded-xl text-gray-600 transition">吃什么选择器</button>
        </div>

        <!-- Input Area -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-600 mb-2" id="input-label">输入你的昵称/名字：</label>
            <input type="text" id="user-input" placeholder="例如：QQ小王子" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white/80">
        </div>

        <!-- Generate Button -->
        <button onclick="generateContent()" class="w-full py-3.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold rounded-xl shadow-lg hover:opacity-95 active:scale-95 transition text-base">
            立即生成 🚀
        </button>

        <!-- Result Box -->
        <div class="mt-6 p-4 rounded-2xl bg-blue-50 border border-blue-100 hidden" id="result-box">
            <div class="text-xs font-semibold text-blue-500 mb-1" id="result-title">生成结果：</div>
            <div class="text-base text-gray-800 font-medium leading-relaxed" id="result-content"></div>
            
            <div class="mt-4 flex gap-2">
                <button onclick="copyResult()" class="flex-1 py-2 bg-white border border-blue-200 text-blue-600 text-xs font-bold rounded-lg shadow-sm hover:bg-blue-50 active:scale-95 transition">
                    复制结果文本 📋
                </button>
            </div>
        </div>

    </div>

    <!-- Footer Credit -->
    <div class="mt-6 text-white/80 text-xs text-center">
        💡 提示：发到QQ群里大家就能一起玩啦！
    </div>

    <script>
        let currentTab = 'roast';

        const fortunes = [
            "大吉大利：今天运气爆棚，买饮料绝对能中「再来一瓶」！",
            "诸事不顺：建议今天少说话多打游戏，水逆退散！",
            "财源广进：走在路上说不定能捡到五毛钱，发财啦！",
            "桃花朵朵：今天可能会遇到让你心动的人，注意形象哦~",
            "平平淡淡：适合抱着零食宅在家追剧，完美的一天。"
        ];

        const excuses = [
            "因为家里网线被猫啃断了，所以暂时无法处理...",
            "刚才突然遭遇外星人绑架，经过我一番智斗才逃回来。",
            "由于我的电脑正在经历一场艰难的思想斗争，需要重启。",
            "我正在进行一项伟大的深度睡眠研究，不便打扰。",
            "今天风太大，我的脑子被吹短路了。"
        ];

        const coupleTalks = [
            "最近有谣言说我喜欢你，我要澄清一下，那不是谣言。",
            "你知道我的缺点是什么吗？是缺点你。",
            "东南西北风，有你就是好风景。",
            "我想买一块地。什么地？你的死心塌地。"
        ];

        const foods = [
            "黄焖鸡米饭：香气扑鼻，汤汁拌饭绝配！",
            "兰州牛肉面：来一碗热腾腾的面，加两两肉！",
            "疯狂肯德基/麦当劳：放纵一下，吃炸鸡汉堡！",
            "麻辣烫 / 冒菜：无辣不欢，各种配菜吸满汤汁！",
            "沙县小吃：经典的鸭腿饭或扁肉拌面！",
            "螺蛳粉：酸辣过瘾，今天就要当个“带味”的人！",
            "简简单单点个外卖盖浇饭：省时省力，搞定！",
            "今天减肥，不吃了！（其实半夜会饿哭）"
        ];

        function switchTab(tab) {
            currentTab = tab;
            ['roast', 'excuse', 'couple', 'food'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = 'py-2.5 text-xs font-bold rounded-xl bg-white shadow-sm text-blue-600 transition';
                } else {
                    btn.className = 'py-2.5 text-xs font-bold rounded-xl text-gray-600 transition';
                }
            });

            const label = document.getElementById('input-label');
            if (tab === 'roast') label.innerText = '输入你的昵称/名字：';
            if (tab === 'excuse') label.innerText = '今天你要应付谁？（如：老板/老师）：';
            if (tab === 'couple') label.innerText = '输入你和TA的名字：';
            if (tab === 'food') label.innerText = '输入你的名字（吃货专属）：';
            
            document.getElementById('result-box').classList.add('hidden');
        }

        function generateContent() {
            const val = document.getElementById('user-input').value.trim() || '干饭人';
            const resultBox = document.getElementById('result-box');
            const resultContent = document.getElementById('result-content');
            const resultTitle = document.getElementById('result-title');

            let text = '';
            if (currentTab === 'roast') {
                resultTitle.innerText = `【 ${val} 的今日运势】`;
                text = fortunes[Math.floor(Math.random() * fortunes.length)];
            } else if (currentTab === 'excuse') {
                resultTitle.innerText = `【 应对 ${val} 的完美借口 】`;
                text = excuses[Math.floor(Math.random() * excuses.length)];
            } else if (currentTab === 'couple') {
                resultTitle.innerText = `【 专属甜甜情话 】`;
                text = coupleTalks[Math.floor(Math.random() * coupleTalks.length)];
            } else if (currentTab === 'food') {
                resultTitle.innerText = `【 ${val} 的今日专属菜单】`;
                text = foods[Math.floor(Math.random() * foods.length)];
            }

            resultContent.innerText = text;
            resultBox.classList.remove('hidden');
        }

        function copyResult() {
            const title = document.getElementById('result-title').innerText;
            const content = document.getElementById('result-content').innerText;
            const fullText = `${title}\n${content} —— 来自QQ趣味生成器`;

            const textarea = document.createElement('textarea');
            textarea.value = fullText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                alertBox('已成功复制到剪贴板，快发给QQ好友吧！');
            } catch (err) {
                alertBox('复制失败，请手动复制。');
            }
            document.body.removeChild(textarea);
        }

        function alertBox(msg) {
            const box = document.createElement('div');
            box.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-xl text-xs shadow-xl z-50 transition-all';
            box.innerText = msg;
            document.body.appendChild(box);
            setTimeout(() => {
                box.style.opacity = '0';
                setTimeout(() => box.remove(), 300);
            }, 2000);
        }
    </script>
</body>
</html>
```
